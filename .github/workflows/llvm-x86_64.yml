name: LLVM x86_64 default build

on:
  push:
    branches:
      - llvm-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64:
    name: Build Generic x86_64 in Debian trixie
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install LLVM and build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf automake bash bc bison bzip2 ca-certificates cmake coreutils curl \
            device-tree-compiler file flex gawk gettext git gperf help2man \
            libelf-dev libc6-dev libncurses-dev libssl-dev libxml-parser-perl \
            libzstd-dev make patch perl pkg-config python3 python3-dev \
            python3-pyelftools python3-setuptools rsync subversion swig time \
            unzip wget xsltproc xz-utils zlib1g-dev gnupg
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | \
            gpg --dearmor -o /etc/apt/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/trixie/ llvm-toolchain-trixie-23 main" \
            > /etc/apt/sources.list.d/llvm-23.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-23 lld-23 llvm-23 llvm-23-dev llvm-23-runtime llvm-23-tools \
            libclang-rt-23-dev libc++-23-dev libc++abi-23-dev libunwind-23-dev
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          clang-23 --version
          ld.lld-23 --version
          df -h .

      - name: Fetch feeds and apply LLVM package overlays
        shell: bash
        run: |
          ./scripts/feeds update -a
          git clone --depth 1 --branch main \
            https://github.com/fxfall/immortalwrt-llvm-packages.git \
            "$RUNNER_TEMP/immortalwrt-llvm-packages"
          sh "$RUNNER_TEMP/immortalwrt-llvm-packages/apply.sh" "$GITHUB_WORKSPACE"
          ./scripts/feeds install -a

      - name: Build default x86_64 firmware with LLVM
        shell: bash
        env:
          FORCE_UNSAFE_CONFIGURE: "1"
        run: |
          cp config/llvm-x86_64.config .config
          mkdir -p logs
          df -h .
          set -o pipefail
          ./scripts/llvm/build-orb.sh -j2 V=s 2>&1 | tee logs/github-actions-x86.log

      - name: Upload x86_64 images and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86_64-${{ github.sha }}
          if-no-files-found: warn
          path: |
            bin/targets/x86/64/immortalwrt-x86-64-generic-*.img.gz
            bin/targets/x86/64/immortalwrt-x86-64-generic-kernel.bin
            bin/targets/x86/64/sha256sums
            bin/targets/x86/64/profiles.json
            logs/github-actions-x86.log
